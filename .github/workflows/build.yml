          echo "sdk.dir=${ANDROID_HOME}" > local.properties
          find app/src -type f | wc -l

      - name: Build
        run: |
          set -euo pipefail
          test -n "${ANDROID_HOME:-}"
          echo "sdk.dir=${ANDROID_HOME}" > local.properties
          cat local.properties
          gradle --version
          # Print first failure causes clearly
          set +e
          gradle assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log
          code=${PIPESTATUS[0]}
          set -e
          echo "---- first errors ----"
          grep -E "^e: |error: |FAILURE: |What went wrong:|Could not|SDK location" build.log | head -50 || true
          if [ "$code" -ne 0 ]; then exit "$code"; fi
          ls -la app/build/outputs/apk/debug/

      - name: Verify strings in APK
        run: |
          set -euo pipefail
          APK=$(ls app/build/outputs/apk/debug/*.apk | head -n1)
          echo "APK=$APK"
          ls -lh "$APK"
          strings "$APK" | grep -E "getprop|magisk|logcat|resetprop|LogReader|ai/venice/pw" | head -30
          strings "$APK" | grep -q getprop
          strings "$APK" | grep -q logcat
          echo OK

      - uses: actions/upload-artifact@v4
        with:
          name: patchwright-8.1-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
