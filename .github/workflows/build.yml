              val b64 = android.util.Base64.encodeToString(xml.toByteArray(), android.util.Base64.NO_WRAP)
              Shell.root("mkdir -p '$d' && echo '$b64' | base64 -d > '$p'")
              Shell.root("chown root:root '$p'; chmod 600 '$p'; chmod 700 '$d'")
              if (Shell.root("test -s '$p' && echo OK").contains("OK")) p else null
            }
            suspend fun link(path: String) = withContext(Dispatchers.IO) {
              Shell.root(
                "mkdir -p /data/adb/tricky_store; rm -f /data/adb/tricky_store/keybox.xml; " +
                  "ln -sf '$path' /data/adb/tricky_store/keybox.xml; echo linked"
              )
            }
            suspend fun scrub() = withContext(Dispatchers.IO) {
              Shell.root("rm -f /data/adb/tricky_store/keybox.xml; echo scrubbed")
            }
          }
