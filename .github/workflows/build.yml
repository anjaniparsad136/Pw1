          package ai.venice.pw.core
          import android.content.Context
          import android.security.keystore.KeyGenParameterSpec
          import android.security.keystore.KeyProperties
          import android.util.Base64
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.withContext
          import java.io.File
          import java.security.KeyStore
          import javax.crypto.Cipher
          import javax.crypto.KeyGenerator
          import javax.crypto.SecretKey
          import javax.crypto.spec.GCMParameterSpec
          object KeyboxStore {
              private fun key(): SecretKey {
                  val ks = KeyStore.getInstance("AndroidKeyStore").apply { load(null) }
                  (ks.getEntry("pw-kb", null) as? KeyStore.SecretKeyEntry)?.let { return it.secretKey }
                  val g = KeyGenerator.getInstance(KeyProperties.KEY_ALGORITHM_AES, "AndroidKeyStore")
                  g.init(KeyGenParameterSpec.Builder("pw-kb", KeyProperties.PURPOSE_ENCRYPT or KeyProperties.PURPOSE_DECRYPT)
                      .setBlockModes(KeyProperties.BLOCK_MODE_GCM)
                      .setEncryptionPaddings(KeyProperties.ENCRYPTION_PADDING_NONE).setKeySize(256).build())
                  return g.generateKey()
              }
              suspend fun save(c: Context, x: String) = withContext(Dispatchers.IO) {
                  val ci = Cipher.getInstance("AES/GCM/NoPadding").apply { init(Cipher.ENCRYPT_MODE, key()) }
                  File(c.filesDir, "kb.enc").writeText(Base64.encodeToString(ci.iv, 2) + ":" + Base64.encodeToString(ci.doFinal(x.toByteArray()), 2))
              }
              suspend fun load(c: Context): String? = withContext(Dispatchers.IO) {
                  val f = File(c.filesDir, "kb.enc")
                  if (!f.exists()) return@withContext null
                  runCatching {
                      val p = f.readText().split(":")
                      val ci = Cipher.getInstance("AES/GCM/NoPadding")
                      ci.init(Cipher.DECRYPT_MODE, key(), GCMParameterSpec(128, Base64.decode(p[0], 2)))
                      String(ci.doFinal(Base64.decode(p[1], 2)))
                  }.getOrNull()
              }
          }
