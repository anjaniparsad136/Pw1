          cat > app/src/main/java/ai/venice/pw/rules/Learn.kt <<'XEOF'
          package ai.venice.pw.rules
          import android.content.Context
          import ai.venice.pw.data.Hit
          import org.json.JSONArray
          import org.json.JSONObject
          import java.io.File
          object Learn {
              data class R(val id: String, val re: String, val what: String, val patch: String,
                           var w: Double, var hits: Int, var ok: Int, var fail: Int)
              private lateinit var f: File
              private val rules = mutableListOf<R>()
              @Volatile private var loaded = false
              private val seed = listOf(
                  R("su.path", "(?i)(su binary|found su|/system/xbin/su)", "su path", "prop.tags", .9, 0, 0, 0),
                  R("magisk", "(?i)magisk", "magisk artifact", "denylist", .9, 0, 0, 0),
                  R("testkeys", "test-keys", "test-keys build", "prop.tags", .95, 0, 0, 0),
                  R("debug", "(?i)ro\\.debuggable", "debuggable", "prop.debuggable", .9, 0, 0, 0),
                  R("sn", "(?i)(basicIntegrity|ctsProfileMatch).*false", "safetynet fail", "keybox", .95, 0, 0, 0),
                  R("pi", "(?i)MEETS_(DEVICE|STRONG)", "integrity verdict", "keybox", .85, 0, 0, 0),
                  R("xposed", "(?i)(xposed|lsposed)", "xposed", "denylist", .85, 0, 0, 0),
                  R("frida", "(?i)(frida|27042)", "frida", "kill.frida", .9, 0, 0, 0),
                  R("vb", "(?i)(verifiedbootstate|flash\\.locked)", "bootstate", "prop.verifiedboot", .9, 0, 0, 0),
                  R("mount", "(?i)(/data/adb|worker)", "mount leak", "denylist", .95, 0, 0, 0),
                  R("avc", "avc:\\s*denied", "selinux denial", "sepolicy", .8, 0, 0, 0),
                  R("crash", "(?i)(FATAL EXCEPTION|tombstone)", "crash", "snapshot", .8, 0, 0, 0))
              fun init(c: Context) { f = File(c.filesDir, "rules.json"); if (!loaded) { load(); loaded = true } }
              private fun load() {
                  rules.clear()
                  if (f.exists()) runCatching {
                      val a = JSONArray(f.readText())
                      for (i in 0 until a.length()) {
                          val o = a.getJSONObject(i)
                          rules += R(o.getString("id"), o.getString("re"), o.getString("what"), o.getString("patch"),
                              o.getDouble("w"), o.optInt("hits"), o.optInt("ok"), o.optInt("fail"))
                      }
                  }
                  if (rules.isEmpty()) { rules += seed; save() }
              }
              fun save() {
                  if (!::f.isInitialized) return
                  runCatching {
                      val a = JSONArray()
                      rules.forEach { r ->
                          a.put(JSONObject().apply {
                              put("id", r.id); put("re", r.re); put("what", r.what); put("patch", r.patch)
                              put("w", r.w); put("hits", r.hits); put("ok", r.ok); put("fail", r.fail)
                          })
                      }
                      f.writeText(a.toString())
                  }
              }
              fun add(re: String, what: String, patch: String): Boolean = runCatching {
                  Regex(re); rules += R("user." + System.currentTimeMillis(), re, what, patch, .6, 0, 0, 0); save(); true
              }.getOrDefault(false)
              fun match(pkg: String, tag: String, msg: String): Hit? {
                  val h = "$tag $msg"
                  var best: R? = null
                  for (r in rules) {
                      if (!runCatching { Regex(r.re).containsMatchIn(h) }.getOrDefault(false)) continue
                      if (best == null || r.w > best.w) best = r
                  }
                  val b = best ?: return null
                  b.hits++; save()
                  return Hit(b.id, pkg, b.what, msg.take(150), b.patch)
              }
              fun feedback(id: String, ok: Boolean) {
                  val r = rules.find { it.id == id } ?: return
                  if (ok) { r.ok++; r.w = (r.w + 0.05).coerceAtMost(1.0) } else { r.fail++; r.w = (r.w - 0.10).coerceAtLeast(0.05) }
                  save()
              }
              fun dump(): String = rules.sortedByDescending { it.w }.joinToString("\n") { "%.2f  ${it.id}  ok=${it.ok} fail=${it.fail}".format(it.w) }
          }
          XEOF

