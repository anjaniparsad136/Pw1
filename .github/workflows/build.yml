          package ai.venice.pw.patch
          import android.util.Base64
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.withContext
          import java.io.ByteArrayInputStream
          import java.security.KeyFactory
          import java.security.Signature
          import java.security.cert.CertificateFactory
          import java.security.cert.X509Certificate
          import java.security.spec.PKCS8EncodedKeySpec
          object Keybox {
            enum class S { VALID, EXPIRED, BROKEN, MALFORMED }
            data class C(val pem: String, val certs: List<X509Certificate>, val st: S, val notes: List<String>, val days: Long)
            suspend fun parse(xml: String): C = withContext(Dispatchers.IO) {
              val notes = mutableListOf<String>()
              val cf = CertificateFactory.getInstance("X.509")
              val blocks = Regex("-----BEGIN CERTIFICATE-----[\\s\\S]*?-----END CERTIFICATE-----")
                .findAll(xml).map { it.value }.toList()
              val key = Regex("-----BEGIN (?:EC )?PRIVATE KEY-----[\\s\\S]*?-----END (?:EC )?PRIVATE KEY-----")
                .find(xml)?.value ?: return@withContext C("", emptyList(), S.MALFORMED, listOf("no key"), 0)
              if (blocks.size < 2) return@withContext C("", emptyList(), S.MALFORMED, listOf("need 2+ certs"), 0)
              val certs = blocks.mapNotNull {
                runCatching {
                  cf.generateCertificate(ByteArrayInputStream(it.toByteArray())) as X509Certificate
                }.getOrNull()
              }
              if (certs.size != blocks.size) return@withContext C("", emptyList(), S.MALFORMED, listOf("bad cert"), 0)
              var ok = true
              for (i in 0 until certs.size - 1) {
                if (!runCatching { certs[i].verify(certs[i + 1].publicKey); true }.getOrDefault(false)) {
                  ok = false; notes += "cert[$i] not signed by next"
                }
              }
              val days = (certs.first().notAfter.time - System.currentTimeMillis()) / 86400000L
              if (days < 0) notes += "expired"
              notes += "local material only; servers may still reject"
              C(key, certs, when {
                !ok -> S.BROKEN
                days < 0 -> S.EXPIRED
                else -> S.VALID
              }, notes, days)
            }
            fun xml(c: C) = buildString {
              appendLine("""<?xml version="1.0"?>""")
              appendLine("""<Keybox DeviceID="pw"><Key algorithm="ecdsa">""")
              appendLine("<PrivateKey format=\"pem\">${c.pem}</PrivateKey><CertificateChain>")
              appendLine("<NumberOfCertificates>${c.certs.size}</NumberOfCertificates>")
              c.certs.forEach {
                appendLine("<Certificate format=\"pem\">" + Base64.encodeToString(it.encoded, Base64.DEFAULT) + "</Certificate>")
              }
              append("</CertificateChain></Key></Keybox>")
            }
            fun test(c: C) = runCatching {
              val body = c.pem.replace(Regex("-----[^-]+-----"), "").replace(Regex("\\s"), "")
              val pk = KeyFactory.getInstance("EC")
                .generatePrivate(PKCS8EncodedKeySpec(Base64.decode(body, Base64.DEFAULT)))
              val sig = Signature.getInstance("SHA256withECDSA").apply { initSign(pk); update("pw".toByteArray()) }.sign()
              Signature.getInstance("SHA256withECDSA").apply {
                initVerify(c.certs.first().publicKey); update("pw".toByteArray())
              }.verify(sig)
            }.getOrDefault(false)
          }
