                          Button(onClick = { LogReader.start(this@MainActivity) }) { Text("Start", fontSize = 11.sp) }
                          OutlinedButton(onClick = { LogReader.stop(this@MainActivity) }) { Text("Stop", fontSize = 11.sp) }
                      }
                      LazyColumn { items(l) { Text(it, fontFamily = FontFamily.Monospace, fontSize = 8.sp) } }
                  }
              }
              @Composable
              private fun HitsTab() {
