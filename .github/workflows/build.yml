              @Composable
              private fun PatchTab(sel: Set<String>, set: (Set<String>) -> Unit) {
                  val m by Repo.msg.collectAsState()
                  Column(Modifier.padding(8.dp)) {
                      Button(onClick = {
                          lifecycleScope.launch {
                              val id = "pw" + System.currentTimeMillis().toString().takeLast(6)
                              val mod = Module(id)
                              sel.forEach { s ->
                                  when (s) {
                                      "prop.tags" -> mod.prop("ro.build.tags", "release-keys").prop("ro.debuggable", "0")
                                      "prop.verifiedboot" -> mod.prop("ro.boot.flash.locked", "1").prop("ro.boot.verifiedbootstate", "green")
                                      "prop.emulator" -> mod.prop("ro.kernel.qemu", "0")
                                      "denylist" -> mod.raw("magisk --denylist enforce 2>/dev/null")
                                      "kill.frida" -> mod.raw("pkill -f frida-server 2>/dev/null")
                                      "tune.vm" -> mod.raw("sysctl -w vm.swappiness=40 2>/dev/null")
                                      "sepolicy" -> mod.raw("magiskpolicy --live 'allow untrusted_app system_file file { read }' 2>/dev/null")
                                      "keybox" -> mod.raw("cp /data/adb/pw/keybox.xml /data/adb/tricky_store/keybox.xml 2>/dev/null")
                                  }
                              }
                              val z = mod.build()
                              Repo.msg.value = if (z == null) "need magisk" else mod.install(z)
                          }
                      }) { Text("Build + install (${sel.size})") }
                      Text(m, fontSize = 10.sp)
                      LazyColumn {
                          items(listOf("prop.tags", "prop.verifiedboot", "prop.emulator", "denylist", "kill.frida", "tune.vm", "sepolicy", "keybox")) { id ->
                              Row(Modifier.fillMaxWidth(), verticalAlignment = Alignment.CenterVertically) {
                                  Checkbox(checked = id in sel, onCheckedChange = { set(if (id in sel) sel - id else sel + id) })
                                  Text(id, fontSize = 11.sp)
                              }
                          }
                      }
                  }
              }
              @Composable
              private fun ApkTab() {
                  val ctx = LocalContext.current
                  val m by Repo.msg.collectAsState()
                  var src by remember { mutableStateOf<Uri?>(null) }
                  var edits by remember { mutableStateOf("test-keys->release-keyz") }
                  val pick = rememberLauncherForActivityResult(ActivityResultContracts.OpenDocument()) { src = it }
                  Column(Modifier.padding(8.dp).verticalScroll(rememberScrollState())) {
                      Button(onClick = { pick.launch(arrayOf("*/*")) }) { Text("Pick APK") }
                      Text(src?.lastPathSegment ?: "none", fontSize = 10.sp)
                      OutlinedTextField(value = edits, onValueChange = { edits = it }, label = { Text("from->to per line") }, modifier = Modifier.fillMaxWidth().height(110.dp))
                      Button(onClick = {
                          lifecycleScope.launch {
                              val u = src ?: return@launch
                              val es = edits.lines().mapNotNull { val p = it.split("->"); if (p.size == 2) ApkPatcher.E(p[0].trim(), p[1].trim()) else null }
                              val d = java.io.File(ctx.cacheDir, "apk").apply { mkdirs() }
                              val i = java.io.File(d, "i.apk"); val o = java.io.File(d, "o.apk")
                              ctx.contentResolver.openInputStream(u)?.use { x -> i.outputStream().use { x.copyTo(it) } }
                              var r = ApkPatcher.patch(i, es, o)
                              val al = java.io.File(d, "a.apk")
                              Shell.exec("zipalign -p -f 4 ${o.absolutePath} ${al.absolutePath}")
                              val ks = java.io.File(d, "k.jks")
                              if (!ks.exists()) Shell.exec("keytool -genkeypair -keystore ${ks.absolutePath} -alias k -keyalg EC -groupname secp256r1 -validity 10000 -storepass pw123456 -keypass pw123456 -dname CN=pw")
                              val sg = java.io.File(d, "s.apk")
                              Shell.exec("apksigner sign --ks ${ks.absolutePath} --ks-pass pass:pw123456 --key-pass pass:pw123456 --out ${sg.absolutePath} ${al.absolutePath}")
                              Repo.msg.value = r + "\nsigned ${sg.absolutePath}"
                          }
                      }) { Text("Patch + sign") }
                      Text(m, fontSize = 9.sp, fontFamily = FontFamily.Monospace)
                  }
              }
              @Composable
              private fun KeyboxTab() {
                  val ctx = LocalContext.current
                  val m by Repo.msg.collectAsState()
                  var path by remember { mutableStateOf<String?>(null) }
                  val pick = rememberLauncherForActivityResult(ActivityResultContracts.OpenDocument()) { u ->
                      u ?: return@rememberLauncherForActivityResult
                      lifecycleScope.launch {
                          val x = ctx.contentResolver.openInputStream(u)?.bufferedReader()?.readText() ?: return@launch
                          val k = Keybox.parse(x)
                          Repo.msg.value = "${k.st} certs=${k.certs.size} days=${k.days} test=${Keybox.test(k)}\n${k.notes.joinToString("\n")}"
                          if (k.st == Keybox.S.VALID) { KeyboxStore.save(ctx, Keybox.xml(k)); Repo.msg.value += "\nstored" }
                      }
                  }
                  Column(Modifier.padding(10.dp).verticalScroll(rememberScrollState())) {
                      Button(onClick = { pick.launch(arrayOf("*/*")) }) { Text("Import keybox") }
                      Text(m, fontSize = 10.sp, fontFamily = FontFamily.Monospace)
                      Button(onClick = { lifecycleScope.launch { val x = KeyboxStore.load(ctx) ?: return@launch; path = Hider.place(ctx, x, true); Repo.msg.value = "placed $path" } }) { Text("Place") }
                      Row(horizontalArrangement = Arrangement.spacedBy(6.dp)) {
                          OutlinedButton(onClick = { lifecycleScope.launch { path?.let { Repo.msg.value = Hider.link(it) } } }) { Text("Link") }
                          OutlinedButton(onClick = { lifecycleScope.launch { Repo.msg.value = Hider.scrub() } }) { Text("Scrub") }
                      }
                  }
              }
