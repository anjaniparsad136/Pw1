# Patchwright 8.1 — improved CI build (sources embedded, complete, non-truncated)
# Save as: .github/workflows/build.yml
# Or run the "write project" logic locally after extracting steps.
name: build
on: [push, workflow_dispatch]

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Setup Android SDK (no obsolete tools package)
        run: |
          set -euo pipefail
          # Prefer runner preinstalled SDK (same idea as your first working workflow)
          if [ -d /usr/local/lib/android/sdk ]; then
            ANDROID_HOME=/usr/local/lib/android/sdk
          else
            ANDROID_HOME="${HOME}/android-sdk"
          fi
          mkdir -p "$ANDROID_HOME/licenses"
          echo -e "24333f0d63266f7550456170d6526017b2b52b31\n84831b400904a625014312442624b864d08ee730" > "$ANDROID_HOME/licenses/android-sdk-license"

          # Ensure cmdline-tools exist
          if [ ! -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            mkdir -p "$ANDROID_HOME/cmdline-tools"
            cd /tmp
            curl -fsSL -o cmdtools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            rm -rf cmdline-tools
            unzip -q cmdtools.zip
            rm -rf "$ANDROID_HOME/cmdline-tools/latest"
            mv cmdline-tools "$ANDROID_HOME/cmdline-tools/latest"
          fi

          SM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SM"
          # Call with FULL path in this same step (GITHUB_PATH does not apply until next step)
          yes | "$SM" --sdk_root="$ANDROID_HOME" --licenses >/dev/null || true
          "$SM" --sdk_root="$ANDROID_HOME" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/build-tools/35.0.0" >> "$GITHUB_PATH"


      - name: Write project
        run: |
          set -euo pipefail
          mkdir -p app/src/main/java/ai/venice/pw/{core,data,patch,rules,ui}
          mkdir -p app/src/main/res/values

          cat > settings.gradle.kts <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement {
            repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
            repositories { google(); mavenCentral() }
          }
          rootProject.name = "pw"
          include(":app")
          EOF

          cat > build.gradle.kts <<'EOF'
          plugins {
            id("com.android.application") version "8.5.2" apply false
            id("org.jetbrains.kotlin.android") version "2.0.21" apply false
            id("org.jetbrains.kotlin.plugin.compose") version "2.0.21" apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx3g
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          android.suppressUnsupportedCompileSdk=35
          EOF

          cat > app/build.gradle.kts <<'EOF'
          plugins {
            id("com.android.application")
            id("org.jetbrains.kotlin.android")
            id("org.jetbrains.kotlin.plugin.compose")
          }
          android {
            namespace = "ai.venice.pw"
            compileSdk = 35
            defaultConfig {
              applicationId = "ai.venice.pw"
              minSdk = 28
              targetSdk = 35
              versionCode = 81
              versionName = "8.1"
            }
            buildFeatures { compose = true }
            compileOptions {
              sourceCompatibility = JavaVersion.VERSION_17
              targetCompatibility = JavaVersion.VERSION_17
            }
            kotlinOptions { jvmTarget = "17" }
            lint { abortOnError = false; checkReleaseBuilds = false }
            packaging { resources.excludes += "META-INF/*.kotlin_module" }
          }
          dependencies {
            implementation(platform("androidx.compose:compose-bom:2024.10.01"))
            implementation("androidx.compose.ui:ui")
            implementation("androidx.compose.material3:material3")
            implementation("androidx.activity:activity-compose:1.9.3")
            implementation("androidx.core:core-ktx:1.13.1")
            implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0")
          }
          EOF

          cat > app/src/main/res/values/strings.xml <<'EOF'
          <resources><string name="app_name">Patchwright</string></resources>
          EOF

          cat > app/src/main/res/values/themes.xml <<'EOF'
          <resources>
            <style name="Theme.Pw" parent="android:Theme.Material.NoActionBar"/>
          </resources>
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:tools="http://schemas.android.com/tools">
            <uses-permission android:name="android.permission.READ_LOGS" tools:ignore="ProtectedPermissions"/>
            <uses-permission android:name="android.permission.QUERY_ALL_PACKAGES" tools:ignore="QueryAllPackagesPermission"/>
            <uses-permission android:name="android.permission.INTERNET"/>
            <uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>
            <uses-permission android:name="android.permission.FOREGROUND_SERVICE_DATA_SYNC"/>
            <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>
            <application
                android:name=".App"
                android:allowBackup="false"
                android:label="@string/app_name"
                android:theme="@style/Theme.Pw">
              <activity android:name=".ui.MainActivity" android:exported="true"
                  android:configChanges="orientation|screenSize|uiMode|keyboardHidden">
                <intent-filter>
                  <action android:name="android.intent.action.MAIN"/>
                  <category android:name="android.intent.category.LAUNCHER"/>
                </intent-filter>
              </activity>
              <service android:name=".core.LogReader" android:exported="false"
                  android:foregroundServiceType="dataSync"/>
            </application>
          </manifest>
          EOF

          cat > app/src/main/java/ai/venice/pw/App.kt <<'EOF'
          package ai.venice.pw
          import android.app.Application
          import ai.venice.pw.core.Env
          import ai.venice.pw.core.Shell
          import ai.venice.pw.rules.Learn
          import kotlinx.coroutines.*
          class App : Application() {
            val scope = CoroutineScope(SupervisorJob() + Dispatchers.IO)
            override fun onCreate() {
              super.onCreate()
              Learn.init(this)
              scope.launch {
                Shell.detect()
                Env.refresh()
                Shell.root("mkdir -p /data/adb/pw/snap /data/adb/pw/modules")
              }
            }
          }
          EOF

          cat > app/src/main/java/ai/venice/pw/core/Shell.kt <<'EOF'
          package ai.venice.pw.core
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.withContext
          import java.util.concurrent.TimeUnit
          enum class Mode { ROOT, ADB, SANDBOX }
          object Shell {
            @Volatile var mode = Mode.SANDBOX; private set
            suspend fun detect(): Mode = withContext(Dispatchers.IO) {
              mode = when {
                raw("su -c id", 6).contains("uid=0") -> Mode.ROOT
                raw("id", 4).contains("uid=2000") -> Mode.ADB
                else -> Mode.SANDBOX
              }
              mode
            }
            suspend fun exec(c: String, t: Long = 25) = withContext(Dispatchers.IO) {
              if (mode == Mode.ROOT) raw("su -c ${q(c)}", t) else raw(c, t)
            }
            suspend fun root(c: String, t: Long = 40) = withContext(Dispatchers.IO) { raw("su -c ${q(c)}", t) }
            suspend fun hasRoot() = withContext(Dispatchers.IO) { raw("su -c id", 6).contains("uid=0") }
            private fun raw(c: String, t: Long): String = try {
              val p = ProcessBuilder("/system/bin/sh", "-c", c).redirectErrorStream(true).start()
              val sb = StringBuilder()
              p.inputStream.bufferedReader().useLines { it.forEach { l -> sb.append(l).append('\n') } }
              if (!p.waitFor(t, TimeUnit.SECONDS)) { p.destroyForcibly(); sb.append("[timeout]") }
              sb.toString().trim()
            } catch (e: Throwable) { "ERR ${e.message}" }
            private fun q(s: String) = "'" + s.replace("'", "'\\''") + "'"
            suspend fun stream(c: String, onLine: (String) -> Unit): Process? = withContext(Dispatchers.IO) {
              try {
                val p = ProcessBuilder("/system/bin/sh", "-c", c).redirectErrorStream(true).start()
                Thread {
                  runCatching { p.inputStream.bufferedReader().useLines { lines -> lines.forEach(onLine) } }
                }.apply { isDaemon = true }.start()
                p
              } catch (e: Throwable) { onLine("ERR ${e.message}"); null }
            }
          }
          EOF

          cat > app/src/main/java/ai/venice/pw/core/Env.kt <<'EOF'
          package ai.venice.pw.core
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.withContext
          object Env {
            data class State(
              val root: Boolean = false,
              val magisk: Boolean = false,
              val kernelsu: Boolean = false,
              val apatch: Boolean = false,
              val resetprop: Boolean = false,
              val magiskpolicy: Boolean = false,
              val tricky: Boolean = false
            ) {
              val canPatch get() = root && (magisk || kernelsu || apatch)
              val canModule get() = root && magisk
            }
            @Volatile var state = State(); private set
            private suspend fun hasBin(b: String) =
              Shell.root("command -v $b >/dev/null 2>&1 && echo y").contains("y")
            suspend fun refresh(): State = withContext(Dispatchers.IO) {
              Shell.detect()
              val r = Shell.hasRoot()
              state = State(
                root = r,
                magisk = r && hasBin("magisk"),
                kernelsu = r && (hasBin("ksud") || Shell.root("test -d /data/adb/ksu && echo y").contains("y")),
                apatch = r && (hasBin("apd") || Shell.root("test -d /data/adb/ap && echo y").contains("y")),
                resetprop = r && hasBin("resetprop"),
                magiskpolicy = r && hasBin("magiskpolicy"),
                tricky = r && Shell.root("test -d /data/adb/tricky_store && echo y").contains("y")
              )
              state
            }
          }
          EOF

          cat > app/src/main/java/ai/venice/pw/core/Surface.kt <<'EOF'
          package ai.venice.pw.core
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.withContext
          data class Finding(val id: String, val sev: Int, val detail: String, val fixable: String = "local")
          object Surface {
            private val bad = mapOf(
              "ro.debuggable" to "1", "ro.secure" to "0", "ro.build.tags" to "test-keys",
              "ro.build.type" to "userdebug", "ro.boot.verifiedbootstate" to "orange",
              "ro.boot.flash.locked" to "0", "ro.boot.veritymode" to "disabled",
              "service.adb.root" to "1", "ro.kernel.qemu" to "1"
            )
            private val paths = listOf(
              "/system/bin/su", "/system/xbin/su", "/sbin/su", "/data/adb/magisk",
              "/data/adb/modules", "/data/adb/ksu", "/data/adb/ap", "/data/adb/lspd",
              "/data/local/tmp/frida-server", "/debug_ramdisk", "/data/adb/tricky_store"
            )
            suspend fun props() = withContext(Dispatchers.IO) {
              val d = Shell.exec("getprop")
              bad.mapNotNull { (k, v) ->
                val g = Regex("""\[$k]: \[(.*?)]""").find(d)?.groupValues?.get(1) ?: return@mapNotNull null
                if (g == v) Finding("prop.$k", 3, "$k=$g", "local") else null
              }
            }
            suspend fun paths() = withContext(Dispatchers.IO) {
              val c = paths.joinToString("; ") { "test -e $it && echo $it" }
              Shell.exec(c).lines().filter { it.startsWith("/") }
                .map { Finding("path.$it", 2, it, "local") }
            }
            suspend fun misc() = withContext(Dispatchers.IO) {
              val o = mutableListOf<Finding>()
              if (Shell.exec("getenforce").equals("Permissive", true))
                o += Finding("selinux", 3, "permissive", "local")
              if (Shell.exec("cat /proc/self/mountinfo").contains("magisk"))
                o += Finding("mount.magisk", 3, "magisk visible in mountinfo", "local")
              o
            }
            suspend fun all() = props() + paths() + misc()
          }
          EOF

          cat > app/src/main/java/ai/venice/pw/core/LogReader.kt <<'EOF'
          package ai.venice.pw.core
          import android.app.*
          import android.content.Context
          import android.content.Intent
          import android.content.pm.ServiceInfo
          import android.os.Build
          import android.os.IBinder
          import androidx.core.app.NotificationCompat
          import ai.venice.pw.data.Repo
          import kotlinx.coroutines.*
          class LogReader : Service() {
            private val scope = CoroutineScope(SupervisorJob() + Dispatchers.IO)
            private var proc: Process? = null
            private val pids = HashMap<Int, String>()
            private val re = Regex(
              """^\d{2}-\d{2}\s+(\d{2}:\d{2}:\d{2})\.\d+\s+(\d+)\s+\d+\s+([VDIWEF])\s+([^:]*?)\s*: (.*)$"""
            )
            override fun onBind(i: Intent?): IBinder? = null
            override fun onStartCommand(i: Intent?, f: Int, s: Int): Int {
              val n = notif()
              if (Build.VERSION.SDK_INT >= 29)
                startForeground(1, n, ServiceInfo.FOREGROUND_SERVICE_TYPE_DATA_SYNC)
              else startForeground(1, n)
              scope.launch {
                Shell.root("pm grant $packageName android.permission.READ_LOGS")
                launch { mapPids() }
                val cmd = if (Shell.mode == Mode.ROOT)
                  "su -c 'logcat -v threadtime -b main -b system -b crash -b radio'"
                else "logcat -v threadtime -b main -b system -b crash"
                proc = Shell.stream(cmd) { ingest(it) }
              }
              return START_STICKY
            }
            private fun ingest(l: String) {
              val m = re.find(l)
              val time: String; val pid: Int; val lvl: String; val tag: String; val msg: String
              if (m != null) {
                time = m.groupValues[1]
                pid = m.groupValues[2].toIntOrNull() ?: 0
                lvl = m.groupValues[3]; tag = m.groupValues[4]; msg = m.groupValues[5]
              } else {
                time = "--:--:--"; pid = 0; lvl = "?"; tag = ""; msg = l
              }
              val pkg = pids[pid] ?: if (pid == 0) "-" else "pid:$pid"
              Repo.log("$time $lvl/$tag [$pkg] $msg")
              Repo.ruleHit(pkg, tag, msg)
            }
            private suspend fun mapPids() {
              while (true) {
                pids.clear()
                Shell.exec("ps -A -o PID,NAME").lines().drop(1).forEach { line ->
                  val a = line.trim().split(Regex("\\s+"), limit = 2)
                  val id = a.getOrNull(0)?.toIntOrNull() ?: return@forEach
                  val nm = a.getOrNull(1) ?: return@forEach
                  if (nm.contains('.')) pids[id] = nm
                }
                delay(4000)
              }
            }
            private fun notif(): Notification {
              if (Build.VERSION.SDK_INT >= 26) {
                val nm = getSystemService(NOTIFICATION_SERVICE) as NotificationManager
                nm.createNotificationChannel(NotificationChannel("pw", "capture", NotificationManager.IMPORTANCE_LOW))
              }
              return NotificationCompat.Builder(this, "pw")
                .setContentTitle("Patchwright capturing")
                .setSmallIcon(android.R.drawable.stat_sys_download)
                .setOngoing(true).build()
            }
            override fun onDestroy() { proc?.destroy(); scope.cancel(); super.onDestroy() }
            companion object {
              fun start(c: Context) = c.startForegroundService(Intent(c, LogReader::class.java))
              fun stop(c: Context) = c.stopService(Intent(c, LogReader::class.java))
            }
          }
          EOF

          cat > app/src/main/java/ai/venice/pw/core/Snapshot.kt <<'EOF'
          package ai.venice.pw.core
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.withContext
          import java.text.SimpleDateFormat
          import java.util.Date
          import java.util.Locale
          object Snapshot {
            private const val DIR = "/data/adb/pw/snap"
            suspend fun take(label: String = ""): String = withContext(Dispatchers.IO) {
              val id = SimpleDateFormat("yyyyMMdd-HHmmss", Locale.US).format(Date()) +
                if (label.isBlank()) "" else "-$label"
              val d = "$DIR/$id"
              Shell.root("mkdir -p '$d'")
              Shell.root("getprop > '$d/props.txt'")
              Shell.root("magisk --denylist ls > '$d/denylist.txt' 2>/dev/null")
              Shell.root("ls /data/adb/modules > '$d/modules.txt' 2>/dev/null")
              Shell.root("chmod -R 600 '$d'")
              id
            }
            suspend fun list(): List<String> = withContext(Dispatchers.IO) {
              Shell.root("ls $DIR 2>/dev/null").lines().filter { it.isNotBlank() }.reversed()
            }
            suspend fun restoreProps(id: String): String = withContext(Dispatchers.IO) {
              val d = "$DIR/$id"
              val props = Shell.root("cat '$d/props.txt'")
              var n = 0
              props.lines().forEach { line ->
                val m = Regex("""\[(.*?)]: \[(.*?)]""").find(line) ?: return@forEach
                val k = m.groupValues[1]
                if (!k.startsWith("persist.") && !k.startsWith("ro.")) return@forEach
                Shell.root("resetprop -n ${m.groupValues[1]} '${m.groupValues[2]}'")
                n++
              }
              "restored $n props from $id"
            }
          }
          EOF

                              cat > app/src/main/java/ai/venice/pw/core/Modem.kt <<'EOF'
          package ai.venice.pw.core
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.withContext
          /**
           * Xperia / Qualcomm-oriented modem + EFS diagnostics (READ-ONLY).
           * Tracks: modemst1, modemst2, fsg, fsc, persist, efs-related by-name nodes,
           * baseband, mcfg-related props, radio logcat.
           * NEVER writes modemst1/st2/fsg/fsc/persist/efs partitions.
           * Can emit a copyable report + safe Magisk prop-side hints only.
           */
          object Modem {
            data class Report(
              val verdict: String,
              val lines: List<String>,
              val plan: String,
              val copyBlob: String,
              val safePatchIds: List<String>
            )
            private val efsNames = listOf(
              "modemst1", "modemst2", "fsg", "fsc", "persist", "efs", "efs1", "efs2", "efsc",
              "modem", "mdm1m9kefs1", "mdm1m9kefs2", "mdm1m9kefsc", "fsg_bak"
            )
            suspend fun diagnose(): Report = withContext(Dispatchers.IO) {
              val lines = mutableListOf<String>()
              fun add(cmd: String, label: String) {
                val o = Shell.root(cmd).lines().filter { it.isNotBlank() }.take(60)
                lines += "===== $label ====="
                lines += o.ifEmpty { listOf("(empty)") }
              }
              add("getprop ro.product.model; getprop ro.product.device; getprop ro.product.name; getprop ro.hardware; getprop ro.boot.hardware", "device")
              add("getprop | grep -iE 'gsm|ril|radio|operator|network|baseband|mcfg|sony|semc|persist.vendor.radio|persist.radio|ro.telephony|sys.radio'", "radio/mcfg props")
              add("getprop ro.baseband; getprop gsm.version.baseband; getprop persist.radio.multisim.config; getprop gsm.sim.state; getprop gsm.operator.alpha", "baseband/sim")
              add("dumpsys telephony.registry 2>/dev/null | head -80", "telephony.registry")
              add("logcat -b radio -d 2>/dev/null | tail -80", "radio buffer tail")
              add("logcat -d 2>/dev/null | grep -iE 'mcfg|modemst|EFS|RIL|QMI|qmi|oem_qmi|NO_SERVICE|OUT_OF_SERVICE|not searching|RADIO_OFF' | tail -80", "filtered main log")
              add("ls -l /dev/block/by-name 2>/dev/null | grep -iE 'modem|fsg|fsc|efs|persist|st1|st2'", "by-name")
              add("ls -l /dev/block/bootdevice/by-name 2>/dev/null | grep -iE 'modem|fsg|fsc|efs|persist|st1|st2'", "bootdevice by-name")
              for (n in efsNames) {
                val hit = Shell.root(
                  "ls -l /dev/block/by-name/$n /dev/block/bootdevice/by-name/$n 2>/dev/null; " +
                    "toybox ls -l /dev/block/by-name/$n 2>/dev/null"
                )
                if (hit.isNotBlank() && !hit.contains("No such") && !hit.startsWith("ERR")) {
                  lines += "===== node $n ====="
                  lines += hit.lines().filter { it.isNotBlank() }
                }
              }
              // Size only via blockdev if present — still not dumping contents
              add(
                "for n in modemst1 modemst2 fsg fsc persist; do " +
                  "p=/dev/block/by-name/\$n; " +
                  "[ -e \$p ] || p=/dev/block/bootdevice/by-name/\$n; " +
                  "if [ -e \$p ]; then echo -n \"\$n \"; blockdev --getsize64 \$p 2>/dev/null || wc -c < \$p; fi; done",
                "partition sizes (bytes)"
              )
              val joined = lines.joinToString("\n")
              val hasSt1 = joined.contains("modemst1")
              val hasSt2 = joined.contains("modemst2")
              val hasFsg = Regex("\\bfsg\\b").containsMatchIn(joined)
              val hasFsc = Regex("\\bfsc\\b").containsMatchIn(joined)
              val hasPersist = joined.contains("persist")
              val mcfgFail = Regex("(?i)mcfg.*fail|failed.*mcfg|mcfg_.*error").containsMatchIn(joined)
              val noSvc = Regex("(?i)OUT_OF_SERVICE|not searching|RADIO_UNAVAILABLE|RADIO_OFF").containsMatchIn(joined)
              val qmiErr = Regex("(?i)qmi.*fail|oem_qmi|QMI_ERR").containsMatchIn(joined)
              lines += "===== summary flags ====="
              lines += "modemst1=$hasSt1 modemst2=$hasSt2 fsg=$hasFsg fsc=$hasFsc persist_node=$hasPersist"
              lines += "mcfgFail=$mcfgFail noSvc=$noSvc qmiErr=$qmiErr"
              val safe = mutableListOf<String>()
              val verdict = when {
                mcfgFail || (noSvc && (hasSt1 || hasFsg)) -> {
                  safe += "snapshot"
                  "Likely EFS/mcfg damage or mismatch (Xperia-style modemst1/st2/fsg/fsc). Restore from YOUR backup offline — app will not flash those partitions."
                }
                qmiErr && noSvc -> {
                  safe += "snapshot"
                  "QMI/RIL errors with no service. Collect report; often needs EFS restore or stock modem reflash outside this app."
                }
                noSvc -> {
                  safe += "snapshot"
                  "No cellular service. Check SIM, airplane mode, baseband prop, and whether modemst*/fsg/fsc were written recently."
                }
                else -> "Modem/EFS nodes inspected. No automatic partition write available (by design)."
              }
              val plan = """
                XPERIA / QUALCOMM SAFE PLAN
                Related partitions: modemst1, modemst2, fsg, fsc, persist (device-dependent)
                THIS APP: diagnose + copyable log only. It does NOT write st1/st2/fsg/fsc/persist.

                If network search died after mcfg/EFS experiment:
                1) Stop flashing more mcfg into EFS.
                2) Restore modemst1 + modemst2 (+ fsg/fsc if your backup includes them) from a backup made on THIS phone before the break.
                3) Use Sony/Xperia-appropriate tools (newflasher/Emma/QFIL-style only if you know the model pack) — not a random Magisk zip.
                4) Matching firmware build + region matters for mcfg.
                5) After restore: reboot, test service, dial *#*#4636#*#* if available.
                6) Paste the COPY BLOB below into Google/AI for a second opinion — do not grant tools write access to EFS blindly.
              """.trimIndent()
              val copyBlob = buildString {
                appendLine("PATCHWRIGHT MODEM REPORT")
                appendLine("verdict: $verdict")
                appendLine(lines.joinToString("\n"))
                appendLine("--- PLAN ---")
                appendLine(plan)
              }
              Report(verdict, lines, plan, copyBlob, safe.distinct())
            }
          }
          EOF

          cat > app/src/main/java/ai/venice/pw/core/Attest.kt <<'EOF'
          package ai.venice.pw.core
          import android.security.keystore.KeyGenParameterSpec
          import android.security.keystore.KeyProperties
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.withContext
          import java.security.KeyPairGenerator
          import java.security.KeyStore
          import java.security.spec.ECGenParameterSpec
          /** Read-only TEE attestation probe. Does not forge server verdicts. */
          object Attest {
            private const val OID = "1.3.6.1.4.1.11129.2.1.17"
            private const val ROT = "1.3.6.1.4.1.11129.2.1.22"
            suspend fun probe(): String = withContext(Dispatchers.IO) {
              runCatching {
                val ks = KeyStore.getInstance("AndroidKeyStore").apply { load(null) }
                val alias = "pw-att"
                if (ks.containsAlias(alias)) ks.deleteEntry(alias)
                val g = KeyPairGenerator.getInstance(KeyProperties.KEY_ALGORITHM_EC, "AndroidKeyStore")
                g.initialize(
                  KeyGenParameterSpec.Builder(alias, KeyProperties.PURPOSE_SIGN)
                    .setAlgorithmParameterSpec(ECGenParameterSpec("secp256r1"))
                    .setDigests(KeyProperties.DIGEST_SHA256)
                    .setAttestationChallenge("pw".toByteArray())
                    .build()
                )
                g.generateKeyPair()
                val cert = ks.getCertificateChain(alias).first() as java.security.cert.X509Certificate
                val ext = cert.getExtensionValue(OID) ?: return@runCatching "no attestation extension"
                val der = Der.read(ext, 0)?.v ?: ext
                val kids = Der.read(der, 0)?.let { Der.kids(it) } ?: emptyList()
                val o = StringBuilder()
                o.appendLine("level=" + when (kids.getOrNull(1)?.let { Der.n(it) }) {
                  0 -> "Software"; 1 -> "TEE"; 2 -> "StrongBox"; else -> "?"
                })
                for (i in listOf(7, 6)) {
                  val e = kids.getOrNull(i) ?: continue
                  for (x in Der.kids(e)) {
                    if (Der.oid(x) != ROT) continue
                    for (r in Der.kids(x)) when (r.tag) {
                      0x82 -> o.appendLine("bootState=" + when (Der.n(r)) {
                        0 -> "Verified"; 1 -> "SelfSigned"; 2 -> "Unverified"; 3 -> "Failed"; else -> "?"
                      })
                      0x81 -> o.appendLine("locked=" + Der.b(r))
                    }
                  }
                }
                o.appendLine("note=local probe only; does not change Google server verdicts")
                ks.deleteEntry(alias)
                o.toString()
              }.getOrElse { "ERR ${it.message}" }
            }
          }
          object Der {
            class T(val tag: Int, val v: ByteArray)
            fun read(b: ByteArray, o: Int): T? {
              if (o + 2 > b.size) return null
              val t = b[o].toInt() and 0xFF
              var p = o + 1
              var l = b[p++].toInt() and 0xFF
              if (l and 0x80 != 0) {
                val n = l and 0x7F
                if (n < 1 || n > 3 || p + n > b.size) return null
                l = 0; repeat(n) { l = (l shl 8) or (b[p++].toInt() and 0xFF) }
              }
              if (p + l > b.size) return null
              return T(t, b.copyOfRange(p, p + l))
            }
            fun kids(t: T): List<T> {
              val o = mutableListOf<T>(); var i = 0
              while (i < t.v.size) {
                val c = read(t.v, i) ?: break
                o += c; i += hl(t.v, i) + c.v.size
              }
              return o
            }
            private fun hl(b: ByteArray, o: Int): Int {
              var p = o + 1; val l = b[p++].toInt() and 0xFF
              if (l and 0x80 != 0) p += (l and 0x7F)
              return p - o
            }
            fun n(t: T) = t.v.fold(0) { a, c -> (a shl 8) or (c.toInt() and 0xFF) }
            fun b(t: T) = t.v.any { it.toInt() != 0 }
            fun oid(t: T): String {
              if (t.v.isEmpty()) return ""
              val s = StringBuilder()
              val f = t.v[0].toInt() and 0xFF
              s.append(f / 40).append('.').append(f % 40)
              var v = 0
              for (i in 1 until t.v.size) {
                val c = t.v[i].toInt() and 0xFF
                v = (v shl 7) or (c and 0x7F)
                if (c and 0x80 == 0) { s.append('.').append(v); v = 0 }
              }
              return s.toString()
            }
          }
          EOF

