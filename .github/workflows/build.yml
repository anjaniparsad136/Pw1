name: build
on: [push, workflow_dispatch]

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v2

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: write project
        run: |
          set -e
          mkdir -p app/src/main/java/ai/venice/pw/core
          mkdir -p app/src/main/java/ai/venice/pw/data
          mkdir -p app/src/main/java/ai/venice/pw/patch
          mkdir -p app/src/main/java/ai/venice/pw/rules
          mkdir -p app/src/main/java/ai/venice/pw/ui
          mkdir -p app/src/main/res/values

          cat > settings.gradle.kts <<'XEOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement {
            repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
            repositories { google(); mavenCentral() }
          }
          rootProject.name = "pw"
          include(":app")
          XEOF

          cat > build.gradle.kts <<'XEOF'
          plugins {
            id("com.android.application") version "8.7.2" apply false
            id("org.jetbrains.kotlin.android") version "2.0.21" apply false
            id("org.jetbrains.kotlin.plugin.compose") version "2.0.21" apply false
          }
          XEOF

          cat > gradle.properties <<'XEOF'
          org.gradle.jvmargs=-Xmx3g
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          android.suppressUnsupportedCompileSdk=35
          XEOF

          cat > app/build.gradle.kts <<'XEOF'
          plugins {
            id("com.android.application")
            id("org.jetbrains.kotlin.android")
            id("org.jetbrains.kotlin.plugin.compose")
          }
          android {
            namespace = "ai.venice.pw"
            compileSdk = 35
            defaultConfig {
              applicationId = "ai.venice.pw"
              minSdk = 28
              targetSdk = 35
              versionCode = 8
              versionName = "8.0"
            }
            buildFeatures { compose = true }
            compileOptions {
              sourceCompatibility = JavaVersion.VERSION_17
              targetCompatibility = JavaVersion.VERSION_17
            }
            kotlinOptions { jvmTarget = "17" }
            lint { abortOnError = false; checkReleaseBuilds = false }
            packaging { resources.excludes += "META-INF/*.kotlin_module" }
          }
          dependencies {
            implementation(platform("androidx.compose:compose-bom:2024.10.01"))
            implementation("androidx.compose.ui:ui")
            implementation("androidx.compose.material3:material3")
            implementation("androidx.activity:activity-compose:1.9.3")
            implementation("androidx.core:core-ktx:1.13.1")
            implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0")
          }
          XEOF

          cat > app/src/main/res/values/strings.xml <<'XEOF'
          <resources><string name="app_name">Patchwright</string></resources>
          XEOF

          cat > app/src/main/res/values/colors.xml <<'XEOF'
          <resources><color name="bg">#101014</color></resources>
          XEOF

          cat > app/src/main/res/values/themes.xml <<'XEOF'
          <resources><style name="Theme.Pw" parent="android:Theme.Material.NoActionBar"><item name="android:windowBackground">@color/bg</item></style></resources>
          XEOF

          cat > app/src/main/AndroidManifest.xml <<'XEOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.READ_LOGS" />
            <uses-permission android:name="android.permission.QUERY_ALL_PACKAGES" />
            <uses-permission android:name="android.permission.INTERNET" />
            <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
            <uses-permission android:name="android.permission.FOREGROUND_SERVICE_DATA_SYNC" />
            <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
            <application
              android:name=".App"
              android:allowBackup="false"
              android:label="@string/app_name"
              android:theme="@style/Theme.Pw">
              <activity
                android:name=".ui.MainActivity"
                android:configChanges="orientation|screenSize|uiMode|keyboardHidden"
                android:exported="true">
                <intent-filter>
                  <action android:name="android.intent.action.MAIN" />
                  <category android:name="android.intent.category.LAUNCHER" />
                </intent-filter>
              </activity>
              <service
                android:name=".core.LogReader"
                android:exported="false"
                android:foregroundServiceType="dataSync" />
            </application>
          </manifest>
          XEOF

          cat > app/src/main/java/ai/venice/pw/App.kt <<'XEOF'
          package ai.venice.pw
          import android.app.Application
          import ai.venice.pw.core.Env
          import ai.venice.pw.core.Shell
          import ai.venice.pw.rules.Learn
          import kotlinx.coroutines.*
          class App : Application() {
              val scope = CoroutineScope(SupervisorJob() + Dispatchers.IO)
              override fun onCreate() {
                  super.onCreate()
                  Learn.init(this)
                  scope.launch { Env.refresh(); Shell.exec("mkdir -p /data/adb/pw/snap") }
              }
          }
          XEOF

          cat > app/src/main/java/ai/venice/pw/core/Shell.kt <<'XEOF'
          package ai.venice.pw.core
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.withContext
          import java.io.File
          import java.util.concurrent.TimeUnit
          enum class Mode { ROOT, ADB, SANDBOX }
          object Shell {
              @Volatile var mode = Mode.SANDBOX
                  private set
              suspend fun detect(): Mode = withContext(Dispatchers.IO) {
                  val r = raw("su -c id", 6)
                  mode = when {
                      r.contains("uid=0") -> Mode.ROOT
                      raw("id", 5).contains("uid=2000") -> Mode.ADB
                      else -> Mode.SANDBOX
                  }
                  mode
              }
              suspend fun exec(c: String, t: Long = 25): String = withContext(Dispatchers.IO) {
                  if (mode == Mode.ROOT) raw("su -c ${q(c)}", t) else raw(c, t)
              }
              suspend fun root(c: String, t: Long = 40): String = withContext(Dispatchers.IO) { raw("su -c ${q(c)}", t) }
              suspend fun hasRoot(): Boolean = withContext(Dispatchers.IO) { raw("su -c id", 6).contains("uid=0") }
              suspend fun put(local: File, dest: String, perms: String = "600"): Boolean = withContext(Dispatchers.IO) {
                  root("mkdir -p ${dest.substringBeforeLast('/')}")
                  root("cp '${local.absolutePath}' '$dest'")
                  root("chown root:root '$dest'; chmod $perms '$dest'")
                  root("test -s '$dest' && echo OK").contains("OK")
              }
              private fun raw(c: String, t: Long): String = try {
                  val p = ProcessBuilder("/system/bin/sh", "-c", c).redirectErrorStream(true).start()
                  val sb = StringBuilder()
                  p.inputStream.bufferedReader().useLines { it.forEach { l -> sb.append(l).append('\n') } }
                  if (!p.waitFor(t, TimeUnit.SECONDS)) { p.destroyForcibly(); sb.append("[timeout]") }
                  sb.toString().trim()
              } catch (e: Throwable) { "ERR ${e.message}" }
              private fun q(s: String) = "'" + s.replace("'", "'\\''") + "'"
              suspend fun stream(c: String, onLine: (String) -> Unit): Process? = withContext(Dispatchers.IO) {
                  try {
                      val p = ProcessBuilder("/system/bin/sh", "-c", c).redirectErrorStream(true).start()
                      Thread { runCatching { p.inputStream.bufferedReader().useLines { l -> l.forEach(onLine) } } }
                          .apply { isDaemon = true }.start()
                      p
                  } catch (e: Throwable) { onLine("ERR ${e.message}"); null }
              }
          }
          XEOF

          cat > app/src/main/java/ai/venice/pw/core/Env.kt <<'XEOF'
          package ai.venice.pw.core
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.withContext
          object Env {
              data class State(val root: Boolean = false, val magisk: Boolean = false, val kernelsu: Boolean = false,
                  val apatch: Boolean = false, val resetprop: Boolean = false, val magiskpolicy: Boolean = false,
                  val tricky: Boolean = false, val zipalign: Boolean = false, val apksigner: Boolean = false) {
                  val canPatch get() = root && (magisk || kernelsu || apatch)
                  val canModule get() = root && magisk
              }
              @Volatile var state = State()
                  private set
              private suspend fun has(b: String) = withContext(Dispatchers.IO) {
                  val r = Shell.root("command -v $b 2>/dev/null"); r.isNotBlank() && !r.startsWith("ERR")
              }
              suspend fun refresh(): State = withContext(Dispatchers.IO) {
                  Shell.detect(); val r = Shell.hasRoot()
                  state = State(root = r,
                      magisk = r && Shell.root("magisk -v").contains("MAGISK", true),
                      kernelsu = r && Shell.root("ksud -v").contains("Kernel", true),
                      apatch = r && Shell.root("apd --version").contains("APatch", true),
                      resetprop = r && has("resetprop"),
                      magiskpolicy = r && has("magiskpolicy"),
                      tricky = r && Shell.root("test -d /data/adb/tricky_store && echo y").contains("y"),
                      zipalign = has("zipalign"), apksigner = has("apksigner"))
                  state
              }
          }
          XEOF

          cat > app/src/main/java/ai/venice/pw/core/Ring.kt <<'XEOF'
          package ai.venice.pw.core
          class Ring<T>(private val cap: Int) {
              private val a = arrayOfNulls<Any?>(cap)
              private var n = 0
              private var h = 0
              @Synchronized fun add(v: T) { a[h] = v; h = (h + 1) % cap; if (n < cap) n++ }
              @Synchronized fun snapshot(): List<T> {
                  val o = ArrayList<T>(n); val s = if (n < cap) 0 else h
                  for (i in 0 until n) { @Suppress("UNCHECKED_CAST") o.add(a[(s + i) % cap] as T) }
                  return o
              }
          }
          XEOF

          cat > app/src/main/java/ai/venice/pw/core/Surface.kt <<'XEOF'
          package ai.venice.pw.core
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.withContext
          data class Finding(val id: String, val sev: Int, val detail: String)
          object Surface {
              private val bad = mapOf("ro.debuggable" to "1", "ro.secure" to "0", "ro.build.tags" to "test-keys",
                  "ro.build.type" to "userdebug", "ro.boot.verifiedbootstate" to "orange",
                  "ro.boot.flash.locked" to "0", "ro.boot.veritymode" to "disabled",
                  "service.adb.root" to "1", "ro.kernel.qemu" to "1")
              private val paths = listOf("/system/bin/su", "/system/xbin/su", "/sbin/su", "/data/adb/magisk",
                  "/data/adb/modules", "/data/adb/ksu", "/data/adb/ap", "/data/adb/lspd",
                  "/data/local/tmp/frida-server", "/debug_ramdisk", "/data/adb/tricky_store")
              suspend fun props(): List<Finding> = withContext(Dispatchers.IO) {
                  val d = Shell.exec("getprop")
                  bad.mapNotNull { (k, v) ->
                      val g = Regex("""\[$k]: \[(.*?)]""").find(d)?.groupValues?.get(1) ?: return@mapNotNull null
                      if (g == v) Finding("prop.$k", 3, "$k=$g") else null
                  }
              }
              suspend fun paths(): List<Finding> = withContext(Dispatchers.IO) {
                  val c = paths.joinToString(" ") { "test -e $it && echo $it" }
                  Shell.exec(c).lines().filter { it.startsWith("/") }.map { Finding("path.$it", 2, it) }
              }
              suspend fun misc(): List<Finding> = withContext(Dispatchers.IO) {
                  val o = mutableListOf<Finding>()
                  if (Shell.exec("getenforce").equals("Permissive", true)) o += Finding("selinux", 3, "permissive")
                  if (Shell.exec("cat /proc/self/mountinfo").contains("magisk")) o += Finding("mount.magisk", 3, "visible")
                  o
              }
          }
          XEOF

          cat > app/src/main/java/ai/venice/pw/core/LogReader.kt <<'XEOF'
          package ai.venice.pw.core
          import android.app.*
          import android.content.Context
          import android.content.Intent
          import android.content.pm.ServiceInfo
          import android.os.Build
          import android.os.IBinder
          import androidx.core.app.NotificationCompat
          import ai.venice.pw.data.Repo
          import kotlinx.coroutines.*
          import java.text.SimpleDateFormat
          import java.util.Date
          import java.util.Locale
          class LogReader : Service() {
              private val scope = CoroutineScope(SupervisorJob() + Dispatchers.IO)
              private var p: Process? = null
              private val pids = HashMap<Int, String>()
              private val ts = SimpleDateFormat("HH:mm:ss", Locale.US)
              private val re = Regex("^\\d{2}-\\d{2}\\s+(\\d{2}:\\d{2}:\\d{2})\\.\\d+\\s+(\\d+)\\s+\\d+\\s+([VDIWEF])\\s+([^:]*?)\\s*: (.*)$")
              override fun onBind(i: Intent?): IBinder? = null
              override fun onStartCommand(i: Intent?, f: Int, s: Int): Int {
                  val n = notif()
                  if (Build.VERSION.SDK_INT >= 29) startForeground(1, n, ServiceInfo.FOREGROUND_SERVICE_TYPE_DATA_SYNC)
                  else startForeground(1, n)
                  scope.launch {
                      Shell.root("pm grant $packageName android.permission.READ_LOGS")
                      launch { mapPids() }
                      val cmd = if (Shell.mode == Mode.ROOT) "su -c 'logcat -v threadtime -b main -b system -b crash -b radio'"
                      else "logcat -v threadtime -b main -b system -b crash"
                      p = Shell.stream(cmd) { ingest(it) }
                  }
                  return START_STICKY
              }
              private fun ingest(l: String) {
                  val m = re.find(l)
                  val time: String; val pid: Int; val lvl: String; val tag: String; val msg: String
                  if (m != null) {
                      time = m.groupValues[1]; pid = m.groupValues[2].toIntOrNull() ?: 0
                      lvl = m.groupValues[3]; tag = m.groupValues[4]; msg = m.groupValues[5]
                  } else { time = ts.format(Date()); pid = 0; lvl = "?"; tag = ""; msg = l }
                  val pkg = pids[pid] ?: if (pid == 0) "-" else "pid:$pid"
                  Repo.log("$time $lvl/$tag [$pkg] $msg")
                  Repo.ruleHit(pkg, tag, msg)
              }
              private suspend fun mapPids() {
                  while (true) {
                      pids.clear()
                      Shell.exec("ps -A -o PID,NAME").lines().drop(1).forEach { l ->
                          val a = l.trim().split(Regex("\\s+"), limit = 2)
                          val id = a.getOrNull(0)?.toIntOrNull() ?: return@forEach
                          val nm = a.getOrNull(1) ?: return@forEach
                          if (nm.contains('.')) pids[id] = nm
                      }
                      delay(4000)
                  }
              }
              private fun notif(): Notification {
                  if (Build.VERSION.SDK_INT >= 26)
                      (getSystemService(NOTIFICATION_SERVICE) as NotificationManager)
                          .createNotificationChannel(NotificationChannel("p", "capture", 2))
                  return NotificationCompat.Builder(this, "p").setContentTitle("capturing").setOngoing(true)
                      .setSmallIcon(android.R.drawable.stat_sys_download).build()
              }
              override fun onDestroy() { p?.destroy(); scope.cancel(); super.onDestroy() }
              companion object {
                  fun start(c: Context) = c.startForegroundService(Intent(c, LogReader::class.java))
                  fun stop(c: Context) = c.stopService(Intent(c, LogReader::class.java))
              }
          }
          XEOF

          cat > app/src/main/java/ai/venice/pw/core/Attest.kt <<'XEOF'
          package ai.venice.pw.core
          import android.security.keystore.KeyGenParameterSpec
          import android.security.keystore.KeyProperties
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.withContext
          import java.security.KeyPairGenerator
          import java.security.KeyStore
          import java.security.spec.ECGenParameterSpec
          object Attest {
              private const val OID = "1.3.6.1.4.1.11129.2.1.17"
              private const val ROT = "1.3.6.1.4.1.11129.2.1.22"
              suspend fun probe(): String = withContext(Dispatchers.IO) {
                  runCatching {
                      val ks = KeyStore.getInstance("AndroidKeyStore").apply { load(null) }
                      val a = "pw-att"
                      if (ks.containsAlias(a)) ks.deleteEntry(a)
                      val g = KeyPairGenerator.getInstance(KeyProperties.KEY_ALGORITHM_EC, "AndroidKeyStore")
                      g.initialize(KeyGenParameterSpec.Builder(a, KeyProperties.PURPOSE_SIGN)
                          .setAlgorithmParameterSpec(ECGenParameterSpec("secp256r1"))
                          .setDigests(KeyProperties.DIGEST_SHA256)
                          .setAttestationChallenge("pw".toByteArray()).build())
                      g.generateKeyPair()
                      val c = ks.getCertificateChain(a).first() as java.security.cert.X509Certificate
                      val ext = c.getExtensionValue(OID) ?: return@runCatching "no attestation extension"
                      val der = Der.read(ext, 0)?.v ?: ext
                      val kids = Der.read(der, 0)?.let { Der.kids(it) } ?: emptyList()
                      val o = StringBuilder()
                      o.appendLine("level=" + when (kids.getOrNull(1)?.let { Der.n(it) }) {
                          0 -> "Software"; 1 -> "TEE"; 2 -> "StrongBox"; else -> "?" })
                      for (i in listOf(7, 6)) {
                          val e = kids.getOrNull(i) ?: continue
                          for (x in Der.kids(e)) {
                              if (Der.oid(x) != ROT) continue
                              for (r in Der.kids(x)) when (r.tag) {
                                  0x82 -> o.appendLine("bootState=" + when (Der.n(r)) {
                                      0 -> "Verified"; 1 -> "SelfSigned"; 2 -> "Unverified"; 3 -> "Failed"; else -> "?" })
                                  0x81 -> o.appendLine("locked=" + Der.b(r))
                              }
                          }
                      }
                      ks.deleteEntry(a); o.toString()
                  }.getOrElse { "ERR ${it.message}" }
              }
          }
          object Der {
              class T(val tag: Int, val v: ByteArray)
              fun read(b: ByteArray, o: Int): T? {
                  if (o + 2 > b.size) return null
                  val t = b[o].toInt() and 0xFF
                  var p = o + 1
                  var l = b[p++].toInt() and 0xFF
                  if (l and 0x80 != 0) {
                      val n = l and 0x7F
                      if (n < 1 || n > 3 || p + n > b.size) return null
                      l = 0; repeat(n) { l = (l shl 8) or (b[p++].toInt() and 0xFF) }
                  }
                  if (p + l > b.size) return null
                  return T(t, b.copyOfRange(p, p + l))
              }
              fun kids(t: T): List<T> {
                  val o = mutableListOf<T>(); var i = 0
                  while (i < t.v.size) { val c = read(t.v, i) ?: break; o += c; i += hl(t.v, i) + c.v.size }
                  return o
              }
              private fun hl(b: ByteArray, o: Int): Int {
                  var p = o + 1; val l = b[p++].toInt() and 0xFF
                  if (l and 0x80 != 0) p += (l and 0x7F)
                  return p - o
              }
              fun n(t: T) = t.v.fold(0) { a, c -> (a shl 8) or (c.toInt() and 0xFF) }
              fun b(t: T) = t.v.any { it.toInt() != 0 }
              fun oid(t: T): String {
                  if (t.v.isEmpty()) return ""
                  val s = StringBuilder(); val f = t.v[0].toInt() and 0xFF
                  s.append(f / 40).append('.').append(f % 40); var v = 0
                  for (i in 1 until t.v.size) {
                      val c = t.v[i].toInt() and 0xFF; v = (v shl 7) or (c and 0x7F)
                      if (c and 0x80 == 0) { s.append('.').append(v); v = 0 }
                  }
                  return s.toString()
              }
          }
          XEOF

          cat > app/src/main/java/ai/venice/pw/core/Modem.kt <<'XEOF'
          package ai.venice.pw.core
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.withContext
          object Modem {
              data class Report(val lines: List<String>, val verdict: String, val plan: String)
              suspend fun diagnose(): Report = withContext(Dispatchers.IO) {
                  val l = mutableListOf<String>()
                  fun add(k: String, v: String) = l.add("$k: ${v.ifBlank { "-" }}")
                  add("baseband", Shell.exec("getprop gsm.version.baseband"))
                  add("sim", Shell.exec("getprop gsm.sim.state"))
                  val tele = Shell.root("dumpsys telephony.registry | grep -E 'mServiceState' | head -5")
                  add("telephony", tele)
                  val sub = Shell.root("for d in /sys/bus/msm_subsys/devices/*/name; do cat \$d; done 2>/dev/null")
                  add("subsys", sub.replace("\n", ","))
                  add("ramdump", Shell.root("ls /data/vendor/ramdump 2>/dev/null | tail -3"))
                  add("fw mcfg", Shell.root("ls /vendor/firmware_mnt/image 2>/dev/null | grep -i mcfg"))
                  val radio = Shell.root("logcat -b radio -d 2>/dev/null | grep -iE 'mcfg|qmi|uim|attach' | tail -25")
                  l.add("--- radio ---"); l.addAll(radio.lines().take(25))
                  val km = Shell.root("dmesg | grep -iE 'subsys|qmi|mcfg' | tail -25")
                  l.add("--- kernel ---"); l.addAll(km.lines().take(25))
                  val v = when {
                      sub.isBlank() -> "modem subsystem not enumerating"
                      l.any { it.startsWith("ramdump:") && it.length > 10 } -> "modem crash dumps present"
                      tele.contains("OUT_OF_SERVICE", true) && radio.contains("mcfg", true) -> "mcfg rejected, radio OOS"
                      radio.contains("UIM_GET_CARD_STATUS", true) -> "SIM not reaching UIM"
                      else -> "no hard fault signature"
                  }
                  Report(l, v, plan(v))
              }
              private fun plan(v: String) = """
          dd if=/dev/block/bootdevice/by-name/fsg of=/sdcard/fsg.img
          dd if=/dev/block/bootdevice/by-name/modemst1 of=/sdcard/modemst1.img
          sha256sum /sdcard/fsg.img
          # 1 flash fsg.mbn from matching firmware
          # 2 remove injected mcfg from EFS so firmware copy wins
          # 3 only then erase modemst1/2
          # 4 svc data disable; svc data enable
          # verdict: $v
          """.trimIndent()
          }
          XEOF

          cat > app/src/main/java/ai/venice/pw/core/Keybox.kt <<'XEOF'
          package ai.venice.pw.core
          import android.util.Base64
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.withContext
          import java.io.ByteArrayInputStream
          import java.security.KeyFactory
          import java.security.Signature
          import java.security.cert.CertificateFactory
          import java.security.cert.X509Certificate
          import java.security.spec.PKCS8EncodedKeySpec
          object Keybox {
              enum class S { VALID, EXPIRED, BROKEN, MALFORMED }
              data class C(val pem: String, val certs: List<X509Certificate>, val st: S, val notes: List<String>, val days: Long)
              suspend fun parse(xml: String): C = withContext(Dispatchers.IO) {
                  val n = mutableListOf<String>()
                  val cf = CertificateFactory.getInstance("X.509")
                  val bl = Regex("-----BEGIN CERTIFICATE-----[\\s\\S]*?-----END CERTIFICATE-----").findAll(xml).map { it.value }.toList()
                  val k = Regex("-----BEGIN (?:EC )?PRIVATE KEY-----[\\s\\S]*?-----END (?:EC )?PRIVATE KEY-----").find(xml)?.value
                      ?: return@withContext bad("no key")
                  if (bl.size < 2) return@withContext bad("chain ${bl.size}")
                  val cs = bl.mapNotNull { runCatching { cf.generateCertificate(ByteArrayInputStream(it.toByteArray())) as X509Certificate }.getOrNull() }
                  if (cs.size != bl.size) return@withContext bad("bad cert")
                  var ok = true
                  for (i in 0 until cs.size - 1)
                      if (!runCatching { cs[i].verify(cs[i + 1].publicKey); true }.getOrDefault(false)) { ok = false; n += "cert[$i] unsigned" }
                  val d = (cs.first().notAfter.time - System.currentTimeMillis()) / 86400000L
                  if (d < 0) n += "expired"
                  C(k, cs, when { !ok -> S.BROKEN; d < 0 -> S.EXPIRED; else -> S.VALID }, n, d)
              }
              private fun bad(m: String) = C("", emptyList(), S.MALFORMED, listOf(m), 0)
              fun xml(c: C) = buildString {
                  appendLine("<?xml version=\"1.0\"?>")
                  appendLine("<Keybox DeviceID=\"pw\"><Key algorithm=\"ecdsa\">")
                  appendLine("<PrivateKey format=\"pem\">${c.pem}</PrivateKey><CertificateChain>")
                  appendLine("<NumberOfCertificates>${c.certs.size}</NumberOfCertificates>")
                  c.certs.forEach { appendLine("<Certificate format=\"pem\">" + Base64.encodeToString(it.encoded, 2) + "</Certificate>") }
                  append("</CertificateChain></Key></Keybox>")
              }
              fun test(c: C) = runCatching {
                  val pk = KeyFactory.getInstance("EC").generatePrivate(PKCS8EncodedKeySpec(
                      Base64.decode(c.pem.replace(Regex("-----[^-]+-----"), "").replace(Regex("\\s"), ""), 0)))
                  val s = Signature.getInstance("SHA256withECDSA").apply { initSign(pk) }
                  s.update("pw".toByteArray()); val sig = s.sign()
                  val v = Signature.getInstance("SHA256withECDSA").apply { initVerify(c.certs.first().publicKey) }
                  v.update("pw".toByteArray()); v.verify(sig)
              }.getOrDefault(false)
          }
