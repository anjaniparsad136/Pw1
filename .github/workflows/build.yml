              @Composable
              private fun PermsTab(pkg: String, set: (String) -> Unit) {
                  var l by remember { mutableStateOf<List<Perms.P>>(emptyList()) }
                  val m by Repo.msg.collectAsState()
                  Column(Modifier.padding(8.dp)) {
                      OutlinedTextField(value = pkg, onValueChange = set, label = { Text("package") }, modifier = Modifier.fillMaxWidth(), singleLine = true)
                      Row(horizontalArrangement = Arrangement.spacedBy(6.dp)) {
                          Button(onClick = { lifecycleScope.launch { l = Perms.list(pkg) } }) { Text("Load", fontSize = 10.sp) }
                          OutlinedButton(onClick = { lifecycleScope.launch { Repo.msg.value = Perms.tame(pkg) } }) { Text("Tame", fontSize = 10.sp) }
                          OutlinedButton(onClick = { lifecycleScope.launch { Repo.msg.value = Perms.disable(pkg) } }) { Text("Off", fontSize = 10.sp) }
                          OutlinedButton(onClick = { lifecycleScope.launch { Repo.msg.value = Perms.enable(pkg) } }) { Text("On", fontSize = 10.sp) }
                      }
                      Text(m, fontSize = 10.sp)
                      LazyColumn {
                          items(l) { p ->
                              Row(Modifier.fillMaxWidth(), verticalAlignment = Alignment.CenterVertically) {
                                  Switch(checked = p.granted, onCheckedChange = { on ->
                                      lifecycleScope.launch { if (on) Perms.grant(pkg, p.name) else Perms.revoke(pkg, p.name); l = Perms.list(pkg) }
                                  })
                                  Text(p.name.removePrefix("android.permission."), fontSize = 10.sp)
                              }
                          }
                      }
                  }
              }
