          cat > app/src/main/java/ai/venice/pw/patch/ApkPatcher.kt <<'XEOF'
          package ai.venice.pw.patch
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.withContext
          import java.io.File
          import java.security.MessageDigest
          import java.util.zip.Adler32
          import java.util.zip.ZipEntry
          import java.util.zip.ZipInputStream
          import java.util.zip.ZipOutputStream
          object ApkPatcher {
              data class E(val from: String, val to: String) { val ok get() = from.toByteArray().size == to.toByteArray().size }
              suspend fun patch(src: File, edits: List<E>, out: File): String = withContext(Dispatchers.IO) {
                  val good = edits.filter { it.ok }
                  val bad = edits.filterNot { it.ok }.map { it.from }
                  var n = 0
                  ZipInputStream(src.inputStream().buffered()).use { zi ->
                      ZipOutputStream(out.outputStream().buffered()).use { zo ->
                          while (true) {
                              val e = zi.nextEntry ?: break
                              var b = zi.readBytes()
                              if (e.name == "AndroidManifest.xml") { val r = axml(b, good); b = r.first; n += r.second }
                              else if (e.name.endsWith(".dex")) { val r = dex(b, good); if (r.second > 0) { b = fix(r.first); n += r.second } }
                              zo.putNextEntry(ZipEntry(e.name)); zo.write(b); zo.closeEntry()
                          }
                      }
                  }
                  "patched $n" + if (bad.isEmpty()) "" else "\nmismatch: ${bad.joinToString()}"
              }
              private fun fix(b: ByteArray): ByteArray {
                  val s = MessageDigest.getInstance("SHA-1"); s.update(b, 32, b.size - 32); s.digest().copyInto(b, 12)
                  val a = Adler32(); a.update(b, 12, b.size - 12); val c = a.value
                  for (i in 0 until 4) b[8 + i] = ((c shr (i * 8)) and 0xFF).toByte()
                  return b
              }
              private fun axml(b: ByteArray, es: List<E>): Pair<ByteArray, Int> {
                  var h = 0; var i = 8
                  while (i + 8 <= b.size) {
                      val t = u16(b, i); val hd = u16(b, i + 2); val s = i32(b, i + 4)
                      if (s <= 0 || i + s > b.size) break
                      if (t == 1 && hd >= 28) {
                          val c = i32(b, i + 8); val f = i32(b, i + 16); val st = i32(b, i + 20)
                          val u = f and 0x100 != 0
                          for (k in 0 until c) {
                              var p = i + st + i32(b, i + hd + k * 4)
                              if (u) {
                                  while (p < b.size && b[p].toInt() and 0x80 != 0) p++; p++
                                  while (p < b.size && b[p].toInt() and 0x80 != 0) p++; p++
                              } else p += 2
                              for (e in es) {
                                  val fr = e.from.toByteArray()
                                  if (p >= 0 && p + fr.size <= b.size && b.copyOfRange(p, p + fr.size).contentEquals(fr)) {
                                      e.to.toByteArray().copyInto(b, p); h++
                                  }
                              }
                          }
                      }
                      i += s
                  }
                  return b to h
              }
              private fun dex(b: ByteArray, es: List<E>): Pair<ByteArray, Int> {
                  var h = 0
                  for (e in es) {
                      val f = e.from.toByteArray(); val t = e.to.toByteArray(); var i = 0
                      while (true) {
                          i = find(b, f, i); if (i < 0) break
                          if ((b.getOrNull(i - 1)?.toInt()?.and(0xFF) ?: 0) == f.size) { t.copyInto(b, i); h++ }
                          i += f.size
                      }
                  }
                  return b to h
              }
              private fun find(h: ByteArray, n: ByteArray, s: Int): Int {
                  o@ for (i in s..h.size - n.size) { for (j in n.indices) if (h[i + j] != n[j]) continue@o; return i }
                  return -1
              }
              private fun u16(b: ByteArray, o: Int) = (b[o].toInt() and 0xFF) or ((b[o + 1].toInt() and 0xFF) shl 8)
              private fun i32(b: ByteArray, o: Int) = (b[o].toInt() and 0xFF) or ((b[o + 1].toInt() and 0xFF) shl 8) or
                  ((b[o + 2].toInt() and 0xFF) shl 16) or ((b[o + 3].toInt() and 0xFF) shl 24)
          }
          XEOF

